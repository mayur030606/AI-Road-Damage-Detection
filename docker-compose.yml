version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: sih26124_postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih26124}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih26124"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
